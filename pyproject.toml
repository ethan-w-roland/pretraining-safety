[project]
name = "pretraining-safety"
version = "0.1.0"
description = "Data filtering during pretraining and distillation of small language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "python-dotenv>=1.2",
    "torch>=2.11",
    "tqdm>=4.70",
    "transformers>=5.18",
]

[project.optional-dependencies]
# src/data/prep_*.py
data = [
    "datasets>=5.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.33",
    "psutil>=7.2",
]
# analysis/
analysis = [
    "matplot2tikz>=0.5.4",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "scipy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# RTX 50-series (Blackwell) GPUs need CUDA 12.8+ wheels
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
